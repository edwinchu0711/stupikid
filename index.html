<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stupikid</title>
  <!-- 封鎖搜尋引擎索引 (Noindex & Disallow Crawlers) -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">

  <!-- 網站圖示 -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/images/SK.png">

  <!-- 立即套用主題 (預設為淺色模式 light) -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('stupikid_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome 圖標庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- 主要樣式表 -->
  <link rel="stylesheet" href="assets/css/style.css?version=4.0">
  
  <!-- PWA Manifest & Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- 加密解密函式庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

  <!-- Service Worker 註冊 -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js')
        .then((reg) => console.log('SW 註冊成功'))
        .catch((err) => console.warn('SW 註冊失敗:', err));
    }
  </script>
</head>

<body>
  <!-- 密碼保護遮罩層 -->
  <div class="password-overlay" id="passwordOverlay" style="display: flex;">
    <div class="password-overlay-actions">
      <button class="theme-toggle-btn overlay-theme-btn" id="overlayThemeToggle" title="切換深淺模式" aria-label="切換主題">
        <i class="fas fa-sun theme-icon-sun"></i>
        <i class="fas fa-moon theme-icon-moon"></i>
      </button>
    </div>
    <div class="password-card-glow"></div>
    <div class="password-container">
      <div class="lock-icon-wrap">
        <i class="fas fa-lock lock-icon"></i>
      </div>
      <h1 class="password-title">內容受保護</h1>
      <p class="password-subtitle">請輸入存取密碼以解鎖資料庫</p>
      
      <div class="password-input-wrap">
        <i class="fas fa-key input-icon"></i>
        <input type="password" class="password-input" id="passwordInput" placeholder="請輸入密碼..." autocomplete="off">
      </div>
      
      <button class="password-btn" id="passwordBtn">
        <span>立即解鎖</span>
        <i class="fas fa-arrow-right"></i>
      </button>
      
      <div class="password-error" id="passwordError">
        <i class="fas fa-circle-exclamation"></i> 密碼錯誤或無法解密，請重新輸入
      </div>
    </div>
  </div>

  <!-- 主要內容區 -->
  <div class="main-content" id="mainContent">
    <!-- 頂部導航列 -->
    <header class="header">
      <div class="nav-container">
        <a href="index.html" class="logo">
          <div class="logo-icon-box">
            <i class="fas fa-play"></i>
          </div>
          <span class="logo-text">Stupikid<span class="logo-dot">.</span></span>
        </a>

        <!-- 搜尋列 -->
        <div class="search-box search-container">
          <i class="fas fa-search search-icon"></i>
          <input type="text" class="search-input" placeholder="搜尋影片標題、標籤..." id="searchInput" autocomplete="off">
        </div>

        <!-- 功能動作區 (深淺主題切換) -->
        <div class="header-actions">
          <button class="theme-toggle-btn" id="themeToggle" title="切換深淺模式" aria-label="切換主題">
            <i class="fas fa-sun theme-icon-sun"></i>
            <i class="fas fa-moon theme-icon-moon"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- 主要內容區域 (串流影音 Feed 模式) -->
    <main class="main-container">
      <!-- 推薦影片區塊 -->
      <section id="recommendedSection" class="content-section">
        <div class="section-header">
          <h2 class="section-title">
            <span class="title-badge"><i class="fas fa-fire-flame-curved"></i></span>
            <span class="title-text">推薦精選</span>
          </h2>
          <button class="view-all-btn" id="viewAllBtn">
            <i class="fas fa-layer-group"></i>
            <span>查看全部</span>
          </button>
        </div>
        <div class="video-grid" id="recommendedGrid"></div>
      </section>

      <!-- 所有影片 / 搜尋結果區塊 -->
      <section id="allVideosSection" class="content-section hidden">
        <div class="section-header">
          <h2 class="section-title">
            <span class="title-badge"><i class="fas fa-film"></i></span>
            <span class="title-text" id="allVideoTitle">所有影片</span>
          </h2>
          <button class="view-all-btn back-btn" id="backBtn">
            <i class="fas fa-chevron-left"></i>
            <span>返回推薦</span>
          </button>
        </div>
        <div class="stats-info" id="statsInfo">
          顯示全部影片
        </div>
        <div class="video-grid" id="videoGrid"></div>
      </section>

      <!-- 查無結果提示狀態 -->
      <div class="no-results hidden" id="noResults">
        <div class="no-results-icon-wrap">
          <i class="fas fa-magnifying-glass"></i>
        </div>
        <h3>找不到相關影片</h3>
        <p>請嘗試其他關鍵字或標籤搜尋</p>
      </div>
    </main>
  </div>

  <!-- 主要業務邏輯腳本 -->
  <script type="module" src="assets/js/script.js?version=4.0"></script>
</body>
</html>
