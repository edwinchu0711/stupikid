<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stupikid - 後台管理中心</title>
  <!-- 封鎖搜尋引擎索引 (Noindex & Disallow Crawlers) -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">

  <!-- 網站圖示 -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/images/SK.png">

  <!-- 立即套用主題 (預設為淺色模式 light) -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('stupikid_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      const isDark = savedTheme === 'dark';
      const themeColor = isDark ? '#080c14' : '#ffffff';
      
      let metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) metaTheme.setAttribute('content', themeColor);
      let metaStatus = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
      if (metaStatus) metaStatus.setAttribute('content', isDark ? 'black-translucent' : 'default');
    })();
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome 圖標庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- 管理員樣式表 -->
  <link rel="stylesheet" href="assets/css/edit-style.css?version=4.1">
  
  <!-- PWA Manifest & Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- 加密解密函式庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>

<body>
  <!-- 密碼保護遮罩層 (Admin Authentication) -->
  <div class="password-overlay" id="passwordOverlay" style="display: flex;">
    <div class="password-overlay-actions">
      <button class="theme-toggle-btn overlay-theme-btn" id="overlayThemeToggle" title="切換深淺模式" aria-label="切換主題">
        <i class="fas fa-sun theme-icon-sun"></i>
        <i class="fas fa-moon theme-icon-moon"></i>
      </button>
    </div>
    <div class="password-card-glow"></div>
    <div class="password-container">
      <div class="lock-icon-wrap">
        <i class="fas fa-shield-halved lock-icon"></i>
      </div>
      <h1 class="password-title">管理員驗證</h1>
      <p class="password-subtitle">請輸入管理員密碼解鎖後台管理</p>
      
      <div class="password-input-wrap">
        <i class="fas fa-key input-icon"></i>
        <input type="password" class="password-input" id="passwordInput" placeholder="請輸入管理密碼..." autocomplete="off">
      </div>
      
      <div class="password-btn-group">
        <button class="password-btn" id="passwordBtn">
          <span>進入管理中心</span>
          <i class="fas fa-arrow-right"></i>
        </button>
        <button class="password-exit-btn" id="passwordExitBtn">
          <i class="fas fa-arrow-left"></i>
          <span>返回首頁</span>
        </button>
      </div>
      
      <div class="password-error" id="passwordError">
        <i class="fas fa-circle-exclamation"></i> 密碼錯誤或解密失敗，請重新輸入
      </div>
    </div>
  </div>

  <!-- 主要內容 (Main Admin Panel) -->
  <div class="main-content" id="mainContent">
    <!-- 管理員頂部導航 -->
    <header class="header">
      <div class="nav-container">
        <a href="index.html" class="logo">
          <div class="logo-icon-box">
            <i class="fas fa-play"></i>
          </div>
          <span class="logo-text">Stupikid<span class="logo-dot">.</span></span>
        </a>
        
        <div class="admin-badge-wrap">
          <div class="admin-badge">
            <i class="fas fa-crown"></i>
            <span>管理中心</span>
          </div>
        </div>

        <div class="header-actions">
          <button class="theme-toggle-btn" id="themeToggle" title="切換深淺模式" aria-label="切換主題">
            <i class="fas fa-sun theme-icon-sun"></i>
            <i class="fas fa-moon theme-icon-moon"></i>
          </button>
          <button class="exit-btn" id="logoutBtn">
            <i class="fas fa-arrow-right-from-bracket"></i>
            <span>登出</span>
          </button>
        </div>
      </div>
    </header>

    <!-- 管理員主工作區 -->
    <main class="admin-container">
      <!-- 新增影片面板 -->
      <section class="add-video-section">
        <div class="section-header">
          <div class="section-title-wrap">
            <span class="section-icon-badge"><i class="fas fa-cloud-arrow-up"></i></span>
            <h2>新增影片</h2>
          </div>
        </div>
        
        <form id="addVideoForm" class="video-form">
          <div class="form-group">
            <label class="form-label">選擇影片來源</label>
            <div class="radio-group">
              <label class="radio-option">
                <input type="radio" name="videoSource" value="vimeo" checked>
                <span class="radio-custom"></span>
                <i class="fab fa-vimeo-v source-icon vimeo"></i>
                <span class="source-name">Vimeo</span>
              </label>
              <label class="radio-option">
                <input type="radio" name="videoSource" value="youtube">
                <span class="radio-custom"></span>
                <i class="fab fa-youtube source-icon youtube"></i>
                <span class="source-name">YouTube</span>
              </label>
            </div>
          </div>

          <div class="form-group">
            <label for="videoUrl" class="form-label">Vimeo 影片 ID 或 網址</label>
            <div class="input-with-icon">
              <i class="fas fa-link input-field-icon"></i>
              <input type="text" id="videoUrl" name="videoUrl" class="form-input" placeholder="例如：1113840188" required autocomplete="off">
            </div>
          </div>

          <div class="form-group">
            <label for="videoTitle" class="form-label">影片標題</label>
            <div class="input-with-icon">
              <i class="fas fa-heading input-field-icon"></i>
              <input type="text" id="videoTitle" name="videoTitle" class="form-input" placeholder="請輸入影片標題..." required autocomplete="off">
            </div>
          </div>

          <div class="form-group">
            <label for="videoTags" class="form-label">影片標籤 (以逗號分隔)</label>
            <div class="input-with-icon">
              <i class="fas fa-tags input-field-icon"></i>
              <input type="text" id="videoTags" name="videoTags" class="form-input" placeholder="例如：搞笑, 精華, 遊戲" autocomplete="off">
            </div>
          </div>

          <div class="form-submit-wrap">
            <button type="submit" class="btn-primary">
              <i class="fas fa-plus"></i>
              <span>確認新增影片</span>
            </button>
          </div>
        </form>
      </section>

      <!-- 影片管理列表面板 -->
      <section class="video-list-section">
        <div class="section-header">
          <div class="section-title-wrap">
            <span class="section-icon-badge"><i class="fas fa-film"></i></span>
            <h2>影片管理庫</h2>
          </div>
          <div class="video-count">
            共 <span id="videoCount">0</span> 部影片
          </div>
        </div>
        
        <div id="videoList" class="video-list"></div>
      </section>
    </main>
  </div>

  <!-- 編輯影片彈窗 (Edit Modal) -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title-wrap">
          <i class="fas fa-pen-to-square"></i>
          <h3>編輯影片資訊</h3>
        </div>
        <button class="close-btn" type="button">
          <i class="fas fa-xmark"></i>
        </button>
      </div>
      
      <form id="editVideoForm" class="video-form modal-form">
        <div class="form-group">
          <label for="editVideoTitle" class="form-label">影片標題</label>
          <input type="text" id="editVideoTitle" name="editVideoTitle" class="form-input" required autocomplete="off">
        </div>

        <div class="form-group">
          <label for="editVideoUrl" class="form-label">影片網址 / ID</label>
          <input type="text" id="editVideoUrl" name="editVideoUrl" class="form-input" required autocomplete="off">
        </div>

        <div class="form-group">
          <label for="editVideoTags" class="form-label">影片標籤 (以逗號分隔)</label>
          <input type="text" id="editVideoTags" name="editVideoTags" class="form-input" autocomplete="off">
        </div>

        <div class="modal-actions">
          <button type="button" id="cancelEdit" class="btn-secondary">
            <i class="fas fa-xmark"></i> 取消
          </button>
          <button type="submit" class="btn-primary">
            <i class="fas fa-check"></i> 儲存變更
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 刪除確認彈窗 (Delete Confirmation Modal) -->
  <div id="deleteModal" class="modal">
    <div class="modal-content delete-modal-content">
      <div class="modal-header">
        <div class="modal-title-wrap danger-title">
          <i class="fas fa-triangle-exclamation"></i>
          <h3>確認刪除影片</h3>
        </div>
        <button class="close-btn" type="button">
          <i class="fas fa-xmark"></i>
        </button>
      </div>
      
      <div class="modal-body">
        <p class="delete-msg">您即將刪除以下影片：</p>
        <div class="delete-item-preview">
          <i class="fas fa-video"></i>
          <span id="deleteVideoTitle"></span>
        </div>
        <p class="warning-text"><i class="fas fa-circle-exclamation"></i> 此操作將直接從資料庫移除，無法復原！</p>
      </div>

      <div class="modal-actions">
        <button type="button" id="cancelDelete" class="btn-secondary">
          <i class="fas fa-xmark"></i> 取消
        </button>
        <button type="button" id="confirmDelete" class="btn-danger">
          <i class="fas fa-trash-can"></i> 確認刪除
        </button>
      </div>
    </div>
  </div>

  <!-- 後台管理邏輯腳本 -->
  <script type="module" src="assets/js/edit-script.js?version=4.1"></script>
</body>
</html>
